<body><header class="top"><div class="brand"><div class="logo">🌐</div><div><b>寰圖</b><small>全球地理快速查詢</small></div></div><nav class="tabs"><button class="tab on">地理</button><button class="tab" disabled>人均 GDP</button><button class="tab" disabled>人口</button><button class="tab" disabled>HDI</button><button class="tab" disabled>世界排名</button></nav><div class="theme"><button id="darkBtn" class="mini">🌙 深色</button><button id="lightBtn" class="mini">☀️ 淺色</button></div><div class="searchbox"><input id="search" class="search" placeholder="搜尋國家，例如：台灣、日本、France…"><div id="results" class="results hidden"></div></div></header>

<aside class="info"><div class="head"><div id="flag" class="flag">🌍</div><div><div id="countryName" class="name">全球</div><div id="englishName" class="en">World Explorer</div><div id="tags" class="tags"><span class="tag">選擇國家開始探索</span></div><div id="dataState" class="dataState">國家資料會自動補齊。</div></div></div>
<section class="section"><div class="stitle"><h3>基本資訊</h3><small>world-countries + 靜態備援資料</small></div><div class="stats"><div class="card"><div class="label">首都</div><div id="capital" class="value">—</div></div><div class="card"><div class="label">人口</div><div id="population" class="value">—</div></div><div class="card"><div class="label">面積</div><div id="area" class="value">—</div></div><div class="card"><div class="label">貨幣</div><div id="currency" class="value">—</div></div><div class="card"><div class="label">語言</div><div id="language" class="value">—</div></div><div class="card"><div class="label">時區</div><div id="timezone" class="value">—</div></div><div class="card"><div class="label">國際電話</div><div id="calling" class="value">—</div></div><div class="card"><div class="label">國家代碼</div><div id="code" class="value">—</div></div></div></section>
<section class="section"><div class="stitle"><h3>地理概況</h3></div><div id="geo" class="geo">選擇國家後顯示洲別與次區域。</div></section>
<section class="section"><div class="stitle"><h3>世界排名</h3><small>來源與日期</small></div><div class="ranks"><div class="rank"><div class="ranktop"><span>⚽ 足球</span><span>FIFA</span></div><div id="footballRank" class="rankvalue">—</div><div class="bar"><div id="footballBar" class="fill"></div></div><div id="footballSource" class="source"></div></div><div class="rank"><div class="ranktop"><span>🏀 籃球</span><span>FIBA</span></div><div id="basketballRank" class="rankvalue">—</div><div class="bar"><div id="basketballBar" class="fill"></div></div><div id="basketballSource" class="source"></div></div><div class="rank baseball"><div class="ranktop"><span>⚾ 棒球</span><span>WBSC</span></div><div id="baseballRank" class="rankvalue">—</div><div class="bar"><div id="baseballBar" class="fill"></div></div><div id="baseballSource" class="source"></div></div><div class="rank"><div class="ranktop"><span>🛡️ 軍力</span><span>GFP</span></div><div id="militaryRank" class="rankvalue">—</div><div class="bar"><div id="militaryBar" class="fill"></div></div><div id="militarySource" class="source"></div></div></div></section>
<section class="section"><div class="stitle"><h3>最近探索</h3><button id="clearRecent" class="btn">清除</button></div><div id="recents" class="recents">尚無紀錄</div></section><p class="note">台灣可放大到 30 倍；放大後會顯示縣市行政區界線與名稱。</p></aside></main>

function transformFor(fs,pad=.78,max=12){if(!fs?.length)return d3.zoomIdentity;const b=path.bounds({type:'FeatureCollection',features:fs}),dx=b[1][0]-b[0][0],dy=b[1][1]-b[0][1],x=(b[0][0]+b[1][0])/2,y=(b[0][1]+b[1][1])/2,s=Math.max(1,Math.min(max,pad/Math.max(dx/1100,dy/650)));return d3.zoomIdentity.translate(550,325).scale(s).translate(-x,-y)}async function moveTo(t,d=450){await d3.select('#map').transition().duration(d).call(zoom.transform,t).end().catch(()=>{})}function featuresFor(f,v){return countries.filter(x=>metaById.get(String(x.id).padStart(3,'0'))?.[f]===v)}function paint(mode,c){countryLayer.selectAll('.country').each(function(f){const m=metaById.get(String(f.id).padStart(3,'0'));this.classList.remove('selected','region','subregion','dim');if(mode==='region')this.classList.add(m?.region===c.region?'region':'dim');if(mode==='subregion')this.classList.add(m?.subregion===c.subregion?'subregion':'dim');if(mode==='country')this.classList.add(m?.cca3===c.cca3?'selected':'dim')})}
async function selectCountry(c){if(!c)return;$('#results').classList.add('hidden');const full=['世界',tr(c.region),tr(c.subregion),name(c)].filter(Boolean).join(' › ');paint('region',c);await moveTo(transformFor(featuresFor('region',c.region),.74,2.6),280);paint('subregion',c);await moveTo(transformFor(featuresFor('subregion',c.subregion),.72,4.2),280);const f=featureById.get(id3(c));paint('country',c);await moveTo(transformFor([f],.84,c.cca3==='TWN'?12:9),380);setInfo(await enrichCountry(c));$('#crumb').textContent=full;$('#status').textContent=c.cca3==='TWN'?'台灣已載入；可繼續放大到 30 倍查看縣市。':`已抵達 ${name(c)}。`}
function normalizeCity(f){if(Array.isArray(f))return{name:f[0],lon:f[1],lat:f[2],code:f[3],pop:f[4],capital:!!f[5]};const p=f.properties||{};return{name:p.name||p.nameascii||'城市',lon:f.geometry.coordinates[0],lat:f.geometry.coordinates[1],code:(p.iso_a2||p.adm0_a3||'').toUpperCase(),pop:Number(p.pop_max||0),capital:/primary|admin/i.test(String(p.capital||''))}}function drawCities(data){currentCities=data.map(normalizeCity).filter(x=>Number.isFinite(x.lon)&&Number.isFinite(x.lat));const sel=cityLayer.selectAll('g.city').data(currentCities,d=>`${d.code}-${d.name}`);sel.exit().remove();const en=sel.enter().append('g').attr('class','city');en.append('circle').attr('class',d=>`city-point${d.capital?' capital-point':''}`);en.append('text').attr('class','city-label');const all=en.merge(sel);all.attr('transform',d=>{const p=projection([d.lon,d.lat]);return p?`translate(${p[0]},${p[1]})`:'translate(-999,-999)'});all.select('text').text(d=>d.name);all.on('click.cityPick',function(e){e.stopPropagation();const was=this.classList.contains('city-selected');cityLayer.selectAll('g.city').classed('city-selected',false);if(!was)d3.select(this).classed('city-selected',true)});updateCities()}
function visibleCity(d){if(currentCountry&&currentK>3){const same=d.code===currentCountry.cca2||d.code===currentCountry.cca3;return same&&(d.pop>=80000||d.capital)}if(currentK<1.6)return d.pop>=5000000||d.capital;if(currentK<3)return d.pop>=1500000||d.capital;return d.pop>=500000}function renderDock(){const dock=$('#cityDock');dock.innerHTML='';if(pref.cityText!=='bottom')return;currentCities.filter(visibleCity).sort((a,b)=>b.pop-a.pop).slice(0,30).forEach(d=>{const s=document.createElement('span');s.className='cityChip';s.textContent=`${d.capital?'★ ':''}${d.name}`;dock.appendChild(s)})}function updateCities(){if(!cityLayer)return;cityLayer.selectAll('g.city').style('display',d=>visibleCity(d)?null:'none');cityLayer.selectAll('circle').style('display',pref.cities?null:'none').attr('r',d=>(d.capital?3:2)/currentK).attr('stroke-width',.7/currentK);cityLayer.selectAll('text').attr('font-size',`${Math.max(.35,10/currentK)}px`).attr('dy',`${-4/currentK}px`).style('display',d=>pref.cityText==='map'&&(d.capital||d.pop>=1000000||currentK>4)?null:'none');renderDock()}
function updateCountyLabels(){if(!countyLayer)return;countyLayer.selectAll('.county-label').attr('font-size',`${Math.max(.32,11/currentK)}px`).style('display',pref.counties&&currentCountry?.cca3==='TWN'&&currentK>=10?null:'none');countyLayer.selectAll('.county').style('display',pref.counties&&currentCountry?.cca3==='TWN'?null:'none')}function updateCountryLabels(){if(!labelLayer)return;labelLayer.selectAll('text').style('display',d=>{const m=metaById.get(String(d.id).padStart(3,'0'));if(!m)return'none';if(currentK<1.6)return Number(m.area||0)>250000?null:'none';if(currentCountry)return m.region===currentCountry.region&&currentK<10?null:'none';return null}).attr('font-size',`${Math.max(.4,10/currentK)}px`)}function updateAllLabels(){updateCountryLabels();updateCities();updateCountyLabels()}
async function loadCities(){drawCities(fallbackCities);const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),3500);try{const r=await fetch('https://cdn.jsdelivr.net/gh/nvkelso/natural-earth-vector@ca96624a/geojson/ne_10m_populated_places_simple.geojson',{signal:ctl.signal});if(r.ok){const geo=await r.json();if(geo?.features?.length)drawCities(geo.features)}}catch{}finally{clearTimeout(timer)}}
async function loadTaiwanCounties(){if(taiwanCounties){drawTaiwanCounties();return}const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),4500);try{const r=await fetch('https://raw.githubusercontent.com/codeforgermany/click_that_hood/main/public/data/taiwan.geojson',{signal:ctl.signal});if(!r.ok)throw 0;taiwanCounties=await r.json();drawTaiwanCounties()}catch{$('#status').textContent='台灣縣市圖資暫時無法載入；仍可繼續放大查看城市。'}finally{clearTimeout(timer)}}function drawTaiwanCounties(){if(!countyLayer||!taiwanCounties?.features)return;const p=d3.geoPath(projection);countyLayer.selectAll('*').remove();countyLayer.selectAll('path.county').data(taiwanCounties.features).join('path').attr('class','county').attr('d',p);countyLayer.selectAll('text.county-label').data(taiwanCounties.features).join('text').attr('class','county-label').attr('x',d=>p.centroid(d)[0]).attr('y',d=>p.centroid(d)[1]).text(d=>d.properties?.name_traditional_chinese||d.properties?.name||'');updateCountyLabels()}
function applyLayers(){labelLayer?.style('display',pref.countries?null:'none');gridLayer?.style('display',pref.grid?null:'none');$('#countryLabelBtn').classList.toggle('on',pref.countries);$('#cityBtn').classList.toggle('on',pref.cities);$('#gridBtn').classList.toggle('on',pref.grid);$('#countyBtn').classList.toggle('on',pref.counties);['Map','Bottom','Off'].forEach(x=>$('#city'+x+'Mode').classList.toggle('on',pref.cityText===x.toLowerCase()));$('#cityDock').classList.toggle('hidden',pref.cityText!=='bottom');updateAllLabels();savePref()}$('#countryLabelBtn').onclick=()=>{pref.countries=!pref.countries;applyLayers()};$('#cityBtn').onclick=()=>{pref.cities=!pref.cities;applyLayers()};$('#gridBtn').onclick=()=>{pref.grid=!pref.grid;applyLayers()};$('#countyBtn').onclick=()=>{pref.counties=!pref.counties;applyLayers()};$('#cityMapMode').onclick=()=>{pref.cityText='map';applyLayers()};$('#cityBottomMode').onclick=()=>{pref.cityText='bottom';applyLayers()};$('#cityOffMode').onclick=()=>{pref.cityText='off';applyLayers()};
function search(q){q=q.trim().toLowerCase();const box=$('#results');if(!q){box.classList.add('hidden');return}const hits=meta.filter(c=>[name(c),c.name?.common,c.name?.official,c.cca2,c.cca3,tr(c.region),tr(c.subregion)].filter(Boolean).join(' ').toLowerCase().includes(q)).slice(0,12);box.innerHTML='';hits.forEach(c=>{const b=document.createElement('button');b.className='result';b.innerHTML=`<span>${flag(c)}</span><span><b>${name(c)}</b><small>${c.name?.common||''} · ${tr(c.region)}</small></span>`;b.onclick=()=>{$('#search').value=name(c);selectCountry(c)};box.appendChild(b)});box.classList.toggle('hidden',!hits.length)}$('#search').oninput=e=>search(e.target.value);$('#clearRecent').onclick=()=>{localStorage.removeItem(STORE);renderRecent()};
try{const [dm,tm,{default:world},{default:wc},rr]=await Promise.all([import('https://cdn.jsdelivr.net/npm/d3@7.9.0/+esm'),import('https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/+esm'),import('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json/+esm'),import('https://cdn.jsdelivr.net/npm/world-countries@5.1.0/+esm'),fetch('./rankings.json').then(r=>r.ok?r.json():{}).catch(()=>({}))]);d3=dm;topo=tm;meta=wc;rankings=rr;countries=topo.feature(world,world.objects.countries).features;countries.forEach(f=>featureById.set(String(f.id).padStart(3,'0'),f));meta.forEach(c=>metaById.set(id3(c),c));projection=d3.geoNaturalEarth1().fitExtent([[18,18],[1082,632]],{type:'FeatureCollection',features:countries});path=d3.geoPath(projection);const svg=d3.select('#map');g=svg.append('g');gridLayer=g.append('g');gridLayer.append('path').datum(d3.geoGraticule10()).attr('class','graticule').attr('d',path);countryLayer=g.append('g');countryLayer.selectAll('path').data(countries).join('path').attr('class','country').attr('d',path).on('click',(e,f)=>{const c=metaById.get(String(f.id).padStart(3,'0'));if(c)selectCountry(c)});labelLayer=g.append('g');labelLayer.selectAll('text').data(countries).join('text').attr('class','country-label').attr('x',d=>path.centroid(d)[0]).attr('y',d=>path.centroid(d)[1]).text(d=>{const c=metaById.get(String(d.id).padStart(3,'0'));return c?name(c):''});countyLayer=g.append('g');cityLayer=g.append('g');zoom=d3.zoom().scaleExtent([1,30]).on('zoom',e=>{currentK=e.transform.k;g.attr('transform',e.transform);updateAllLabels()});svg.call(zoom);$('#plus').onclick=()=>svg.transition().call(zoom.scaleBy,1.5);$('#minus').onclick=()=>svg.transition().call(zoom.scaleBy,1/1.5);function reset(){currentCountry=null;countryLayer.selectAll('.country').attr('class','country');svg.transition().duration(300).call(zoom.transform,d3.zoomIdentity);$('#crumb').textContent='世界';$('#status').textContent='點選國家，或搜尋國家開始探索。';$('#worldBtn').disabled=true;updateAllLabels()}$('#w
